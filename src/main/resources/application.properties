spring.application.name=notes

# Server Configuration
server.port=8080

#  (MAMP MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/deployment_notes?serverTimezone=Asia/Taipei&useSSL=false&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging System
logging.level.root=INFO
logging.level.com.dev.notes=DEBUG
logging.file.name=logs/deployment_notes.log

#Rolling Policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
